<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nonum" />
    <meta name="application-name" content="Nonum" />

    <!-- Static Web App Manifest for instant browser searchbar & tab settings PWA detection -->
    <link rel="manifest" href="/manifest.json" id="pwa-manifest-link" />

    <!-- Apple Touch Icons & Favicons -->
    <link rel="apple-touch-icon" href="https://i.ibb.co/jkVhh3Bt/96737.jpg" id="apple-icon-link" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://i.ibb.co/jkVhh3Bt/96737.jpg?v=2" id="favicon-link-32" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://i.ibb.co/jkVhh3Bt/96737.jpg?v=2" id="favicon-link-16" />

    <title>Nonum | Decentralized Anonymous Grid</title>

    <script>
      (function() {
        // Capture PWA install prompt without suppressing native browser search bar download icon
        window.addEventListener('beforeinstallprompt', function(e) {
          window.pwaInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
        });

        var path = window.location.pathname;
        var isAdminRoute = path.startsWith('/admin') || path.includes('admin');

        if (isAdminRoute) {
          var manifestLink = document.getElementById('pwa-manifest-link');
          if (manifestLink) {
            manifestLink.href = '/admin-manifest.json';
          }
          var faviconUrl = 'https://i.ibb.co/ZRKMHqfJ/file-0000000031c082118352d747206b85c5.png';
          var fav32 = document.getElementById('favicon-link-32');
          var fav16 = document.getElementById('favicon-link-16');
          var appIcon = document.getElementById('apple-icon-link');
          if (fav32) fav32.href = faviconUrl + '?v=2';
          if (fav16) fav16.href = faviconUrl + '?v=2';
          if (appIcon) appIcon.href = faviconUrl + '?v=2';

          if (path.includes('report')) {
            document.title = "Nonum Admin Reports";
          } else {
            document.title = "Nonum Admin Console";
          }
        } else {
          if (path.startsWith('/report') || path.includes('report')) {
            document.title = "Nonum Security Report";
          } else if (path.startsWith('/policies') || path.includes('policies')) {
            document.title = "Nonum Policies";
          } else if (path.startsWith('/guidelines') || path.includes('guidelines')) {
            document.title = "Nonum Guidelines";
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
