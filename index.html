<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Nonum | Decentralized Anonymous Grid</title>
    <link id="pwa-manifest-link" rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        // Capture PWA install prompt without suppressing native browser omnibox/search bar download button
        window.addEventListener('beforeinstallprompt', function(e) {
          window.pwaInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
        });

        var host = (window.location.hostname || '').toLowerCase();
        var path = (window.location.pathname || '').toLowerCase();
        var isAdminRoute = host.startsWith('admin.') || host.includes('admin') || path.startsWith('/admin') || path.includes('admin');
        var manifestUrl = isAdminRoute ? '/admin-manifest.json' : '/manifest.json';
        var faviconUrl = isAdminRoute
          ? 'https://i.ibb.co/ZRKMHqfJ/file-0000000031c082118352d747206b85c5.png'
          : 'https://i.ibb.co/jkVhh3Bt/96737.jpg';
        var titleText = "Nonum | Decentralized Anonymous Grid";
        if (isAdminRoute) {
          if (path.includes('report')) {
            titleText = "Nonum Admin Reports";
          } else {
            titleText = "Nonum Admin Console";
          }
        } else {
          if (path.startsWith('/report') || path.includes('report')) {
            titleText = "Nonum Security Report";
          } else if (path.startsWith('/policies') || path.includes('policies')) {
            titleText = "Nonum Policies";
          } else if (path.startsWith('/guidelines') || path.includes('guidelines')) {
            titleText = "Nonum Guidelines";
          }
        }
        
        try {
          var manifestLink = document.getElementById('pwa-manifest-link');
          if (manifestLink) {
            manifestLink.href = manifestUrl;
          } else {
            manifestLink = document.createElement('link');
            manifestLink.id = 'pwa-manifest-link';
            manifestLink.rel = 'manifest';
            manifestLink.href = manifestUrl;
            document.head.appendChild(manifestLink);
          }

          var favicon32 = document.createElement('link');
          favicon32.id = 'favicon-link-32';
          favicon32.rel = 'icon';
          favicon32.type = 'image/png';
          favicon32.sizes = '32x32';
          favicon32.href = faviconUrl + '?v=2';
          document.head.appendChild(favicon32);

          var favicon16 = document.createElement('link');
          favicon16.id = 'favicon-link-16';
          favicon16.rel = 'icon';
          favicon16.type = 'image/png';
          favicon16.sizes = '16x16';
          favicon16.href = faviconUrl + '?v=2';
          document.head.appendChild(favicon16);

          var appleIcon = document.createElement('link');
          appleIcon.id = 'apple-icon-link';
          appleIcon.rel = 'apple-touch-icon';
          appleIcon.href = faviconUrl + '?v=2';
          document.head.appendChild(appleIcon);

          document.title = titleText;
        } catch(e) {
          console.error('Error executing head initialization script:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
